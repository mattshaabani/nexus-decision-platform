services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - NEXUS_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      redis:
        condition: service_started
      mlflow:
        condition: service_started
    volumes:
      # Live reload for development (source only)
      - ./src:/app/src
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - GIT_PYTHON_REFRESH=quiet
    restart: unless-stopped

  demo-seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    user: "0:0"   # run seed as root once so volume writes succeed in demo
    volumes:
      - ./:/app
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      - mlflow
    command: python scripts/run_investor_demo.py

volumes:
  redis-data:
  mlflow-data:


