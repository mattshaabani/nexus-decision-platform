[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-decision-platform"
version = "0.1.0"
description = "Governed Decision Intelligence for regulated financial decisions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Matt Shaabani" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "mlflow>=2.15",
    "prometheus-client>=0.20",
    "structlog>=24.4",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pre-commit>=3.8",
]

[project.scripts]
nexus = "nexus.entrypoints.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=nexus --cov-report=term-missing"

[tool.importlinter]
root_package = "nexus"

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["nexus.domain"]
forbidden_modules = [
    "nexus.adapters",
    "nexus.entrypoints",
    "fastapi",
    "mlflow",
    "redis",
]

[[tool.importlinter.contracts]]
name = "Application cannot import adapters or entrypoints"
type = "forbidden"
source_modules = ["nexus.application"]
forbidden_modules = ["nexus.adapters", "nexus.entrypoints"]
